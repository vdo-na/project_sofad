version: '3.8'

services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: weather_postgres
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (кэширование)
  redis:
    image: redis:7-alpine
    container_name: weather_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Наш бэкенд на FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-backend:v1
    container_name: weather_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_PORT=8000
      - DATABASE_URL=postgresql://app_user:app_password@db:5432/app_db
      - REDIS_URL=redis://redis:6379/0
      - EXTERNAL_API_URL=https://api.open-meteo.com/v1/forecast
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 4. Сборщик метрик Prometheus (Блок Б6)
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: weather_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # 5. Визуализация метрик Grafana (Блок Б6)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: weather_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: